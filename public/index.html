<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<script src="config.js"></script>
<title>Sofía RX — Dashboard del técnico</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Instrument+Serif&amp;display=swap">
<style>
/* Concepto: panel de mostrador. Resumen arriba, cola de pendientes a la izquierda, detalle de la llamada a la derecha. */
:root {
  --bg: #F3F7F6;
  --surface: #FFFFFF;
  --surface-2: #F7FAF9;
  --ink: #0E2A2E;
  --muted: #4A5D60;
  --line: #D3E2DE;
  --accent: #0B7A75;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3F1EE;
  --new-bg: #FDEBD8;
  --new-fg: #8F3F0B;
  --prog-bg: #E1EEF9;
  --prog-fg: #0B4F8A;
  --done-bg: #E1F3E8;
  --done-fg: #17633D;
  --urgent-bg: #FBE3DE;
  --urgent-fg: #A32B1D;
  --font-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Instrument Serif', Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1A1D;
    --surface: #11272B;
    --surface-2: #0E2125;
    --ink: #E6F1EF;
    --muted: #9FB6B3;
    --line: #244045;
    --accent: #3FB8A8;
    --accent-ink: #06201F;
    --accent-soft: #143538;
    --new-bg: #3B2A19;
    --new-fg: #F4B986;
    --prog-bg: #162F48;
    --prog-fg: #97C8F3;
    --done-bg: #163A2A;
    --done-fg: #8FD9AE;
    --urgent-bg: #4A2420;
    --urgent-fg: #F6A89C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1A1D;
  --surface: #11272B;
  --surface-2: #0E2125;
  --ink: #E6F1EF;
  --muted: #9FB6B3;
  --line: #244045;
  --accent: #3FB8A8;
  --accent-ink: #06201F;
  --accent-soft: #143538;
  --new-bg: #3B2A19;
  --new-fg: #F4B986;
  --prog-bg: #162F48;
  --prog-fg: #97C8F3;
  --done-bg: #163A2A;
  --done-fg: #8FD9AE;
  --urgent-bg: #4A2420;
  --urgent-fg: #F6A89C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--font-body);
}
button, input { font: inherit; color: inherit; }
.app { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Encabezado */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; min-width: 0; }
.logo { font-family: var(--font-display); font-size: 34px; line-height: 1; letter-spacing: 0.005em; }
.sub { font-size: 14px; color: var(--muted); }
.top-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--done-fg); }
.chip.demo { background: var(--new-bg); color: var(--new-fg); border-color: transparent; }
.clock { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); min-width: 72px; text-align: right; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
:where(button, input, a):focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Resumen */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(165px, 100%), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .label { font-size: 13px; font-weight: 600; color: var(--muted); }
.kpi .num { font-size: 36px; line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .hint { font-size: 13px; color: var(--muted); }
.kpi.strong { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.kpi.strong .label, .kpi.strong .hint { color: var(--accent-ink); opacity: 0.85; }

/* Cuerpo */
.grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.toolbar { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); }
.tab .n { margin-left: 6px; font-variant-numeric: tabular-nums; }
.tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tools input { flex: 1 1 200px; min-width: 0; min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.list { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 10px; border: 1px solid transparent; border-radius: 10px; background: transparent; cursor: pointer; text-align: left; }
.row:hover { background: var(--surface-2); }
.row[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.row.fresh { animation: fresh 1.6s ease-out 1; }
@keyframes fresh { from { background: var(--new-bg); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .row.fresh { animation: none; } }
.ico { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.line1 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.line1 strong { font-weight: 600; }
.line2 { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.time { flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

.pill { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.6; }
.st-new { background: var(--new-bg); color: var(--new-fg); }
.st-progress { background: var(--prog-bg); color: var(--prog-fg); }
.st-done { background: var(--done-bg); color: var(--done-fg); }
.st-urgent { background: var(--urgent-bg); color: var(--urgent-fg); }
.st-type { background: var(--accent-soft); color: var(--accent); }

/* Detalle */
.detail { padding: 20px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 16px; }
.detail h2 { margin: 0; font-size: 22px; line-height: 1.2; }
.d-head { display: flex; flex-direction: column; gap: 8px; }
.d-phone { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.d-phone b { color: var(--ink); font-weight: 600; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 12px; margin: 0; }
.facts div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.facts dt { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; }
.sec-title { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.d-summary { margin: 0; }
.chat { display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 92%; padding: 8px 12px; border-radius: 12px; font-size: 14px; }
.msg .who { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
.msg.sofia { align-self: flex-start; background: var(--accent-soft); }
.msg.pac { align-self: flex-end; background: var(--surface-2); border: 1px solid var(--line); }
.alert { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.alert svg { color: var(--done-fg); flex: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; border-top: 1px solid var(--line); padding-top: 16px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; max-width: calc(100% - 32px); z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

@media (max-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; }
  .clock { text-align: left; }
}
</style>
</head>
<body>
<style>
.login { max-width: 420px; margin: 12vh auto 0; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.login h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 34px; }
.login p { margin: 0; color: var(--muted); }
.login input { min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.login .err { color: var(--urgent-fg); font-weight: 600; min-height: 1.4em; }
[hidden] { display: none !important; }
.chip.off { background: var(--urgent-bg); color: var(--urgent-fg); border-color: transparent; }
.chip.off .dot { background: var(--urgent-fg); }
.btn.link { border: none; background: none; color: var(--muted); min-height: 34px; padding: 0 8px; font-weight: 500; }
</style>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand">
      <span class="logo">Sofía RX</span>
      <span class="sub" id="pharmacy">Dashboard del técnico</span>
    </div>
    <div class="top-right">
      <span class="chip" id="conn"><span class="dot" aria-hidden="true"></span><span id="connText">Conectando…</span></span>
      <span class="clock" id="clock"></span>
      <button class="btn link" id="logout" type="button">Salir</button>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-label="Resumen del día"></section>

  <div class="grid">
    <section class="panel" aria-label="Cola de pendientes">
      <div class="toolbar">
        <div class="tabs" id="tabs"></div>
        <div class="tools">
          <label class="sr" for="q">Buscar por paciente, medicamento o receta</label>
          <input id="q" type="search" placeholder="Buscar paciente, medicamento o receta" autocomplete="off">
          <button class="btn small" id="hideDone" type="button" aria-pressed="false">Ocultar completados</button>
        </div>
      </div>
      <ul class="list" id="list"></ul>
    </section>
    <section class="panel detail" id="detail" aria-label="Detalle de la llamada"></section>
  </div>
</div>

<form class="panel login" id="login" hidden>
  <h1>Sofía RX</h1>
  <p>Ingrese la clave del dashboard para ver los pendientes de la farmacia.</p>
  <label class="sr" for="tok">Clave del dashboard</label>
  <input id="tok" type="password" autocomplete="current-password" placeholder="Clave del dashboard" required>
  <div class="err" id="loginErr" role="alert"></div>
  <button class="btn primary" type="submit">Entrar</button>
</form>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------
     CONFIGURACIÓN
     La URL del backend se define en config.js (apiBase). Vacío = mismo dominio.
     ------------------------------------------------------------------ */
  var cfg = window.SOFIA_CONFIG || {};
  var API_BASE = String(cfg.apiBase || '').trim().replace(/\/+$/, '');
  var POLL_MS = 5000;
  var TOKEN_KEY = 'sofia_dash_token';

  var CONFIG = { pharmacyName: '', alertTarget: 'el WhatsApp del técnico' };
  var LABEL_TYPE = { refill: 'Refill', message: 'Mensaje', transfer: 'Transferida' };
  var LABEL_STATUS = { 'new': 'Nuevo', 'progress': 'En proceso', 'done': 'Listo' };
  var PILL_STATUS = { 'new': 'st-new', 'progress': 'st-progress', 'done': 'st-done' };

  /* ------------------------------------------------------------------
     CAPA DE DATOS — API real de Sofía RX
     ------------------------------------------------------------------ */
  var token = '';
  try { token = sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { token = ''; }

  var items = [];
  var listeners = [];
  var lastSig = '';
  function emit() { listeners.forEach(function (fn) { fn(); }); }

  function request(path, opts) {
    opts = opts || {};
    var headers = { 'Authorization': 'Bearer ' + token };
    if (opts.body) headers['Content-Type'] = 'application/json';
    return fetch(API_BASE + path, { method: opts.method || 'GET', headers: headers, body: opts.body, cache: 'no-store' });
  }

  var DataSource = {
    list: function () { return items.slice(); },
    /** Devuelve una promesa con { ok, auth, fresh } */
    refresh: function () {
      return request('/api/pendientes').then(function (res) {
        if (res.status === 401) return { ok: false, auth: false };
        if (!res.ok) return { ok: false, auth: true };
        return res.json().then(function (data) {
          var next = data.items || [];
          var known = {};
          items.forEach(function (i) { known[i.id] = true; });
          var fresh = items.length || lastSig ? next.filter(function (i) { return !known[i.id]; }) : [];
          if (data.pharmacyName) CONFIG.pharmacyName = data.pharmacyName;
          if (data.alertTarget) CONFIG.alertTarget = data.alertTarget;
          var sig = JSON.stringify(next);
          var changed = sig !== lastSig;
          lastSig = sig;
          if (changed) { items = next; emit(); }
          return { ok: true, auth: true, fresh: fresh };
        });
      }, function () { return { ok: false, auth: true, network: true }; });
    },
    update: function (id, status) {
      var prev = items;
      items = items.map(function (it) { return it.id === id ? Object.assign({}, it, { status: status }) : it; });
      emit();
      return request('/api/pendientes/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({ status: status }) })
        .then(function (res) {
          if (!res.ok) throw new Error('http ' + res.status);
          lastSig = JSON.stringify(items);
        })
        .catch(function (err) {
          items = prev;
          emit();
          throw err;
        });
    },
    subscribe: function (fn) { listeners.push(fn); }
  };

  /* ------------------------------------------------------------------
     ESTADO DE LA INTERFAZ
     ------------------------------------------------------------------ */
  var state = { filter: 'all', q: '', hideDone: false, selected: null, freshId: null };

  var elApp = document.getElementById('app');
  var elLogin = document.getElementById('login');
  var elTok = document.getElementById('tok');
  var elLoginErr = document.getElementById('loginErr');
  var elKpis = document.getElementById('kpis');
  var elTabs = document.getElementById('tabs');
  var elList = document.getElementById('list');
  var elDetail = document.getElementById('detail');
  var elQ = document.getElementById('q');
  var elHide = document.getElementById('hideDone');
  var elClock = document.getElementById('clock');
  var elToast = document.getElementById('toast');
  var elConn = document.getElementById('conn');
  var elConnText = document.getElementById('connText');
  var toastTimer = null;
  var pollTimer = null;

  /* ------------------------------------------------------------------
     UTILIDADES
     ------------------------------------------------------------------ */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtAgo(ts) {
    var mins = Math.max(0, Math.floor((Date.now() - ts) / 60000));
    if (mins < 1) return 'ahora';
    if (mins < 60) return 'hace ' + mins + ' min';
    var h = Math.floor(mins / 60), m = mins % 60;
    if (h >= 24) return 'hace ' + Math.floor(h / 24) + ' d';
    return 'hace ' + h + ' h' + (m ? ' ' + m + ' min' : '');
  }
  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString('es-PR', { hour: 'numeric', minute: '2-digit' });
  }
  function isToday(ts) { return new Date(ts).toDateString() === new Date().toDateString(); }
  function icon(name, size) {
    var s = size || 18;
    var p = {
      refill: '<polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>',
      message: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>',
      transfer: '<polyline points="19 1 23 5 19 9"></polyline><line x1="15" y1="5" x2="23" y2="5"></line><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>',
      check: '<polyline points="20 6 9 17 4 12"></polyline>',
      copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>',
      chat: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>'
    }[name] || '';
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
  }
  function showToast(text) {
    elToast.textContent = text;
    elToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elToast.classList.remove('show'); }, 2600);
  }
  function summaryLine(it) {
    if (it.type === 'refill') return [it.med, it.pickup, it.rx ? 'Receta ' + it.rx : ''].filter(Boolean).join(' · ') || 'Refill';
    if (it.type === 'transfer') return 'Pasada al recetario' + (it.duration ? ' · ' + it.duration : '');
    return it.msg || 'Mensaje';
  }

  /* ------------------------------------------------------------------
     CONSULTAS
     ------------------------------------------------------------------ */
  function matchesQuery(it, q) {
    if (!q) return true;
    var hay = [it.name, it.phone, it.rx, it.med, it.msg].join(' ').toLowerCase();
    return hay.indexOf(q.toLowerCase()) !== -1;
  }
  function visibleItems() {
    return DataSource.list().filter(function (it) {
      if (state.filter !== 'all' && it.type !== state.filter) return false;
      if (state.hideDone && it.status === 'done') return false;
      return matchesQuery(it, state.q);
    }).sort(function (a, b) {
      var ad = a.status === 'done' ? 1 : 0, bd = b.status === 'done' ? 1 : 0;
      if (ad !== bd) return ad - bd;
      if (!!a.urgent !== !!b.urgent) return a.urgent ? -1 : 1;
      return b.createdAt - a.createdAt;
    });
  }
  function counts() {
    var all = DataSource.list();
    var today = all.filter(function (i) { return isToday(i.createdAt); });
    return {
      all: all.length,
      refill: all.filter(function (i) { return i.type === 'refill'; }).length,
      message: all.filter(function (i) { return i.type === 'message'; }).length,
      transfer: all.filter(function (i) { return i.type === 'transfer'; }).length,
      pending: all.filter(function (i) { return i.status !== 'done'; }).length,
      refillsToday: today.filter(function (i) { return i.type === 'refill'; }).length,
      unread: all.filter(function (i) { return i.type === 'message' && i.status === 'new'; }).length,
      transfersToday: today.filter(function (i) { return i.type === 'transfer'; }).length
    };
  }

  /* ------------------------------------------------------------------
     RENDER
     ------------------------------------------------------------------ */
  function renderKpis() {
    var c = counts();
    elKpis.innerHTML =
      '<div class="kpi strong"><span class="label">Pendientes</span><span class="num">' + c.pending + '</span><span class="hint">por atender ahora</span></div>' +
      '<div class="kpi"><span class="label">Refills de hoy</span><span class="num">' + c.refillsToday + '</span><span class="hint">pedidos recibidos</span></div>' +
      '<div class="kpi"><span class="label">Mensajes sin leer</span><span class="num">' + c.unread + '</span><span class="hint">esperan respuesta</span></div>' +
      '<div class="kpi"><span class="label">Pasadas al farmacéutico</span><span class="num">' + c.transfersToday + '</span><span class="hint">hoy</span></div>';
  }

  function renderTabs() {
    var c = counts();
    var defs = [['all', 'Todos'], ['refill', 'Refills'], ['message', 'Mensajes'], ['transfer', 'Transferidas']];
    elTabs.innerHTML = defs.map(function (d) {
      return '<button class="tab" type="button" data-filter="' + d[0] + '" aria-pressed="' + (state.filter === d[0]) + '">' + d[1] + '<span class="n">' + c[d[0]] + '</span></button>';
    }).join('');
  }

  function renderList() {
    var rows = visibleItems();
    if (!rows.length) {
      elList.innerHTML = '<li class="empty">' + (DataSource.list().length ? 'No hay llamadas con estos filtros.' : 'Todavía no hay llamadas. Cuando Sofía atienda una, aparecerá aquí.') + '</li>';
      return;
    }
    elList.innerHTML = rows.map(function (it) {
      var cur = it.id === state.selected;
      return '<li><button class="row' + (it.id === state.freshId ? ' fresh' : '') + '" type="button" data-id="' + esc(it.id) + '" aria-current="' + cur + '">' +
        '<span class="ico">' + icon(it.type) + '</span>' +
        '<span class="main"><span class="line1"><strong>' + esc(it.name || 'Paciente') + '</strong>' +
        '<span class="pill ' + (PILL_STATUS[it.status] || '') + '">' + esc(LABEL_STATUS[it.status] || it.status) + '</span>' +
        (it.urgent && it.status !== 'done' ? '<span class="pill st-urgent">Urgente</span>' : '') +
        '</span><span class="line2">' + esc(summaryLine(it)) + '</span></span>' +
        '<span class="time">' + fmtAgo(it.createdAt) + '</span></button></li>';
    }).join('');
  }

  function fact(label, value) {
    return '<div><dt>' + label + '</dt><dd>' + esc(value || '—') + '</dd></div>';
  }

  function renderDetail() {
    var it = DataSource.list().filter(function (i) { return i.id === state.selected; })[0];
    if (!it) {
      elDetail.innerHTML = '<div class="empty">Seleccione una llamada de la lista para ver el detalle.</div>';
      return;
    }
    var facts = '';
    if (it.type === 'refill') {
      facts = fact('Medicamento', it.med) + fact('Recogido', it.pickup) + (it.rx ? fact('Receta', it.rx) : '');
    } else if (it.type === 'transfer') {
      facts = fact('Motivo', it.msg) + fact('Duración', it.duration);
    } else {
      facts = fact('Mensaje', it.msg) + (it.rx || it.med ? fact('Receta', [it.med, it.rx].filter(Boolean).join(' · ')) : '');
    }
    var chat = (it.transcript || []).map(function (l) {
      var sofia = l[0] === 'S';
      return '<div class="msg ' + (sofia ? 'sofia' : 'pac') + '"><span class="who">' + (sofia ? 'Sofía' : 'Paciente') + '</span>' + esc(l[1]) + '</div>';
    }).join('') || '<p class="d-summary" style="color:var(--muted)">La conversación aparece cuando termina la llamada.</p>';
    var actions = '';
    if (it.status === 'new') {
      actions = '<button class="btn primary" type="button" data-act="progress">Tomar este pendiente</button>';
    } else if (it.status === 'progress') {
      actions = '<button class="btn primary" type="button" data-act="done">' + icon('check', 16) + 'Marcar como listo</button><button class="btn" type="button" data-act="new">Devolver a nuevo</button>';
    } else {
      actions = '<button class="btn" type="button" data-act="new">Reabrir</button>';
    }
    var alertLine = it.alertSentAt
      ? 'Alerta enviada a ' + esc(CONFIG.alertTarget) + ' a las ' + fmtTime(it.alertSentAt)
      : 'No se envió alerta de WhatsApp para este pendiente';
    elDetail.innerHTML =
      '<div class="d-head"><h2>' + esc(it.name || 'Paciente') + '</h2>' +
      '<div class="d-phone"><b id="phone">' + esc(it.phone || 'Sin número') + '</b>' +
      (it.phone ? '<button class="btn small" type="button" data-act="copy">' + icon('copy', 15) + 'Copiar número</button>' : '') + '</div>' +
      '<div class="pills"><span class="pill st-type">' + esc(LABEL_TYPE[it.type] || it.type) + '</span><span class="pill ' + (PILL_STATUS[it.status] || '') + '">' + esc(LABEL_STATUS[it.status] || it.status) + '</span>' +
      (it.urgent && it.status !== 'done' ? '<span class="pill st-urgent">Urgente</span>' : '') + '</div></div>' +
      '<dl class="facts">' + facts + '</dl>' +
      (it.summary ? '<div><h3 class="sec-title">Resumen de Sofía</h3><p class="d-summary">' + esc(it.summary) + '</p></div>' : '') +
      '<div><h3 class="sec-title">Conversación</h3><div class="chat">' + chat + '</div></div>' +
      '<div class="alert">' + icon('chat', 18) + '<span>' + alertLine + '</span></div>' +
      '<div class="actions">' + actions + '</div>';
  }

  function renderAll() {
    if (!state.selected && items.length) state.selected = visibleItems()[0] ? visibleItems()[0].id : items[0].id;
    document.getElementById('pharmacy').textContent = 'Dashboard del técnico' + (CONFIG.pharmacyName ? ' · ' + CONFIG.pharmacyName : '');
    renderKpis();
    renderTabs();
    renderList();
    renderDetail();
  }

  /* ------------------------------------------------------------------
     CONEXIÓN, LOGIN Y POLLING
     ------------------------------------------------------------------ */
  function setConn(ok) {
    elConn.classList.toggle('off', !ok);
    elConnText.textContent = ok ? 'Sofía activa' : 'Sin conexión';
  }
  function showLogin(msg) {
    clearInterval(pollTimer);
    elApp.hidden = true;
    elLogin.hidden = false;
    elLoginErr.textContent = msg || '';
    elTok.focus();
  }
  function showApp() {
    elLogin.hidden = true;
    elApp.hidden = false;
  }
  var wasOnline = true;
  function poll(first) {
    return DataSource.refresh().then(function (r) {
      if (!r.auth) {
        token = '';
        try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* sin almacenamiento */ }
        showLogin(first ? 'Clave incorrecta.' : 'La sesión venció. Ingrese la clave de nuevo.');
        return false;
      }
      setConn(r.ok);
      if (r.ok) {
        showApp();
        if (first) renderAll();
        if (r.fresh && r.fresh.length) {
          var f = r.fresh.slice().sort(function (a, b) { return b.createdAt - a.createdAt; })[0];
          state.freshId = f.id;
          renderList();
          showToast('Nueva llamada atendida por Sofía: ' + (f.name || 'paciente'));
        }
      } else if (wasOnline) {
        showToast('No se pudo conectar con Sofía. Reintentando…');
      }
      wasOnline = r.ok;
      return true;
    });
  }
  function start() {
    clearInterval(pollTimer);
    poll(true).then(function (ok) {
      if (ok) pollTimer = setInterval(function () { poll(false); }, POLL_MS);
    });
  }

  elLogin.addEventListener('submit', function (e) {
    e.preventDefault();
    token = elTok.value.trim();
    if (!token) return;
    try { sessionStorage.setItem(TOKEN_KEY, token); } catch (err) { /* sin almacenamiento */ }
    elTok.value = '';
    elLoginErr.textContent = '';
    start();
  });
  document.getElementById('logout').addEventListener('click', function () {
    token = '';
    items = [];
    lastSig = '';
    state.selected = null;
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* sin almacenamiento */ }
    showLogin('');
  });

  /* ------------------------------------------------------------------
     EVENTOS DE LA INTERFAZ
     ------------------------------------------------------------------ */
  elList.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-id]');
    if (!btn) return;
    state.selected = btn.getAttribute('data-id');
    state.freshId = null;
    renderList();
    renderDetail();
    var again = elList.querySelector('[data-id="' + state.selected + '"]');
    if (again) again.focus();
    if (window.matchMedia('(max-width: 900px)').matches) {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      elDetail.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    }
  });

  elTabs.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-filter]');
    if (!btn) return;
    state.filter = btn.getAttribute('data-filter');
    renderTabs();
    renderList();
    var again = elTabs.querySelector('[data-filter="' + state.filter + '"]');
    if (again) again.focus();
  });

  elQ.addEventListener('input', function () {
    state.q = elQ.value.trim();
    renderList();
  });

  elHide.addEventListener('click', function () {
    state.hideDone = !state.hideDone;
    elHide.setAttribute('aria-pressed', String(state.hideDone));
    renderList();
  });

  elDetail.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'copy') {
      var phone = document.getElementById('phone');
      var text = phone ? phone.textContent : '';
      var fallback = function () {
        if (!phone) return;
        var r = document.createRange();
        r.selectNodeContents(phone);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
        showToast('Número seleccionado, cópielo con Ctrl+C');
      };
      try {
        navigator.clipboard.writeText(text).then(function () { showToast('Número copiado'); }, fallback);
      } catch (err) { fallback(); }
      return;
    }
    var messages = { progress: 'Pendiente tomado', done: 'Pendiente marcado como listo', 'new': 'Pendiente devuelto a nuevo' };
    var id = state.selected;
    DataSource.update(id, act).then(function () {
      showToast(messages[act]);
    }, function () {
      showToast('No se pudo guardar el cambio. Intente de nuevo.');
    });
    var next = elDetail.querySelector('[data-act]');
    if (next) next.focus();
  });

  DataSource.subscribe(renderAll);

  function tick() {
    elClock.textContent = new Date().toLocaleTimeString('es-PR', { hour: 'numeric', minute: '2-digit' });
  }
  setInterval(function () { tick(); if (!elApp.hidden) renderList(); }, 30000);
  tick();

  if (token) start(); else showLogin('');
})();
</script>

</body>
</html>
